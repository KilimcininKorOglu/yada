# Configuration pointing at the containers from docker-compose.yml.
#
# Pass it explicitly, since it must not shadow a real configuration:
#   dist/unbound-dns-cli --config docker/unbound-dns.docker.conf check

servers:
  - name: ns1
    host: 127.0.0.1
    port: 8340
  - name: ns2
    host: 127.0.0.1
    port: 8342
  # No control channel on this one, so the refresh has to fall through to
  # systemctl. It is in the stack precisely to keep that path tested.
  - name: ns3
    host: 127.0.0.1
    port: 8344

defaults:
  user: user01
  records_file: /etc/unbound/local_records.conf
  main_config: /etc/unbound/unbound.conf
  sudo: true

ssh:
  binary: ssh
  connect_timeout: 10s
  options:
    - BatchMode=yes
    # The containers get fresh host keys on every start, so a known_hosts
    # entry would be wrong by the next run.
    - StrictHostKeyChecking=no
    - UserKnownHostsFile=/dev/null
    - LogLevel=ERROR
    # IdentitiesOnly stops a loaded agent from offering its own keys first and
    # exhausting the server's authentication attempts before this one is tried.
    - IdentityFile=docker/keys/id_test
    - IdentitiesOnly=yes

behaviour:
  parallel: true
  max_parallel: 3
  backup_before_write: true
  reload_strategy: auto
  # The integration script is not interactive.
  confirm_destructive: false

log:
  level: info
  # The desktop interface appends its log here, so a session can be read back
  # after the window is closed.
  file: docker/unbound-dns.log
