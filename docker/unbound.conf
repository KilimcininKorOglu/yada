# Main configuration of a test server. This is the file unbound-checkconf is
# pointed at, and the one that splices the records fragment into its server
# clause.
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    access-control: 0.0.0.0/0 allow

    do-daemonize: yes
    pidfile: "/run/unbound.pid"
    directory: "/etc/unbound"

    # Running as root keeps the pidfile and the control socket writable
    # without extra plumbing. A real deployment would not do this; a
    # throwaway container has nothing to protect.
    username: ""
    chroot: ""

    use-syslog: no
    logfile: ""

    # No trust anchor is configured: the container cannot reach the root
    # servers, so validation would fail every query and mask real errors.
    # Recursion is irrelevant here anyway, since only local data is tested.
    root-hints: ""

    include: /etc/unbound/local_records.conf

# The entrypoint writes this file, which is how one server in the stack ends
# up without a control channel and exercises the refresh fallback.
include: /etc/unbound/remote-control.conf
